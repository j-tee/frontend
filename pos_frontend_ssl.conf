server {
    listen 80;
    listen [::]:80;
    server_name pos.alphalogiquetechnologies.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.alphalogiquetechnologies.com;

    # SSL Certificate paths (will be set by certbot)
    ssl_certificate /etc/letsencrypt/live/pos.alphalogiquetechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.alphalogiquetechnologies.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Root directory where your built files are located
    root /var/www/pos/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/pos_frontend_access.log;
    error_log /var/log/nginx/pos_frontend_error.log;

    # Main location block - serve static files and handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        expires -1;
        add_header Cache-Control "public, no-cache";
    }

    # Cache static assets (js, css, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent access to source files
    location ~* \.(map|ts|tsx)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom 404 page (optional)
    error_page 404 /index.html;

    # Custom 50x error page (optional)
    error_page 500 502 503 504 /index.html;
}
